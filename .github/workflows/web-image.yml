# 构建家庭游戏大厅的 Godot Web 版镜像并推到 ghcr。
#
# 为什么要在 CI 里跑 Godot 导出:build/web/ 有 38 MB(单个 wasm 就 37.7 MB),
# 不进仓库。所以 CI 得自己下 Godot + 导出模板再导出,不能只 COPY。
#
# 首次构建后,把 ghcr 包 meirongdev/godot-games-web 的可见性设为 Public,
# 否则集群拉取需要 imagePullSecret。
#
# ☠️ 集群的 Kyverno 禁止 :latest。这里推 :latest 只供手工 pull,
#    部署侧(homelab)必须钉 :<short-sha>。
name: godot-games-web image

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - godot/**
      - images/web/**
      - tools/build_web.sh
      - .github/workflows/web-image.yml

permissions:
  contents: read
  packages: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 从 GitHub Releases 直接取,不依赖第三方 godot-ci 镜像的 tag 是否存在。
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sL "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sL "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o tpl.tpz
          unzip -q tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # 刻意调本地那个脚本,不在这里另写一串 godot 命令 —— 只留一条导出路径。
      # 场景路径检查、制品自检(无测试脚手架、无 nakama.cfg)都在脚本里,
      # 跟模块镜像先跑 busted 一样:检查不过就不推。
      - name: Export web build + checks
        run: GODOT=/usr/local/bin/godot tools/build_web.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/meirongdev/godot-games-web:latest
            ghcr.io/meirongdev/godot-games-web:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 契约 §2 交付的是「集群能拉到的镜像」。ghcr 包默认 private,匿名拉 403,
      # 而部署侧没有 imagePullSecret 只能匿名拉 —— 这个开关 2026-08-26 漏过一次,
      # 两个包都是 private,homelab 直接卡住。没门禁的手动步骤就会漏,所以这里验。
      - name: Verify anonymous pull
        env:
          PKG: godot-games-web
          TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          REPO="meirongdev/${PKG}"
          TOKEN=$(curl -sS "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))')
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${REPO}/manifests/${TAG}")
          if [ "$CODE" != "200" ]; then
            echo "::error::匿名拉 ghcr.io/${REPO}:${TAG} 返回 ${CODE} —— 包还是 private,集群拉不到。到 https://github.com/users/meirongdev/packages/container/${PKG}/settings 把可见性改成 Public,然后重跑本 workflow"
            exit 1
          fi
          echo "匿名可拉 ✓ ghcr.io/${REPO}:${TAG}"

      - name: 部署提示
        run: |
          echo "::notice::homelab 侧把 family-lobby-web 的 image tag 换成 ${{ steps.sha.outputs.short }}"
