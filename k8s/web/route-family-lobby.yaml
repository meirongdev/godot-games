---
# HTTPRoute: games.meirong.dev -> family-lobby-web:80
#
# 本文件的存在即 DNS 变更:external-dns 监听 gateway-httproute 源,
# 为 hostname 建代理 CNAME + 归属 TXT。不要去改 cloudflare/terraform。
# ⚠️ policy 是 upsert-only —— 删掉这个路由**不会**删掉 DNS 记录,退役时要手工清。
#
# 这个页面通过浏览器直连 https://nakama.meirong.dev(另一个子域),属跨源请求。
# Nakama 对 /v2/* 回 `Access-Control-Allow-Origin: *`(2026-08-26 实测),
# WebSocket 升级也带同样的头,所以不需要额外 CORS 配置。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: family-lobby-web
  namespace: personal-services
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: kube-system
      port: 80          # TLS 在 Cloudflare 边缘终止
  hostnames:
    - "games.meirong.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: family-lobby-web
          port: 80
          weight: 1
