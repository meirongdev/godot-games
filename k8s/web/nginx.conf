# Godot Web 导出的静态站点配置。
#
# 两个容易踩的点:
#   1. .wasm 必须是 application/wasm,否则浏览器拒绝流式编译,只报一句含糊的
#      "Incorrect response MIME type"。nginx 1.21.1+ 的 mime.types 自带这条,
#      Dockerfile 里有断言,缺了就构建失败,不留到运行时才发现。
#   2. index.wasm 有 38 MB。gzip_static 用构建期预压好的 .gz(约 10 MB),
#      而不是每次请求现压 —— 现压 38 MB 会把 CPU 打满。
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    gzip_static  on;
    gzip_vary    on;

    # wasm/pck 带指纹的话可以长缓存;现在没有指纹,所以让浏览器每次校验。
    # 重新部署后用户不刷新也能拿到新版本,对家用场景比缓存命中率重要。
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查,给 readiness/liveness 用。不写日志免得刷屏。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
