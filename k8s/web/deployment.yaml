---
# 家庭游戏大厅的 Godot Web 版静态托管。
# 入口: https://games.meirong.dev   路由见 k8s/web/route-family-lobby.yaml
#
# 纯静态,无状态,无 PVC。所有游戏状态在 Nakama(personal-services/nakama)里,
# 这个 pod 挂了只是页面打不开,不影响正在进行的对局。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-lobby-web
  namespace: personal-services
  labels:
    app: family-lobby-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: family-lobby-web
  template:
    metadata:
      labels:
        app: family-lobby-web
    spec:
      containers:
        - name: web
          # ☠️ **不能用 :latest** —— 集群的 Kyverno `disallow-latest-tag` 是
          #    failureAction: Enforce,带 :latest 的 Pod 会被直接拒绝创建
          #    (报 "禁止使用 :latest tag")。CI 会同时推 :latest 和 :<short-sha>,
          #    :latest 只供手工 docker pull,**部署必须钉 sha**。
          #    换 tag 就是发版:跑完 CI 把这里的 sha 换成新的。
          image: ghcr.io/meirongdev/godot-games-web:REPLACE_WITH_SHORT_SHA
          ports:
            - containerPort: 8080
              name: http
          resources:
            # 静态文件服务,基本不吃 CPU。内存主要是 nginx 自身 + 页面缓存。
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            # nginx 要往 /tmp 写临时文件。收紧成 true + emptyDir 挂 /tmp 大概率可行,
            # 但没有集群可验 —— 按本仓库 nakama.yaml 的同一条原则,不赌未测过的改动。
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: family-lobby-web
  namespace: personal-services
  labels:
    app: family-lobby-web
spec:
  type: ClusterIP
  selector:
    app: family-lobby-web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
